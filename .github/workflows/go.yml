name: Go

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: go-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned TypeScript compiler
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test clean checkout
        run: go test ./...

      - name: Build generation-tag registration packages
        run: |
          pkgs=$(grep -rl '^//go:build jsonschema$' --include='*.go' examples | xargs -n1 dirname | sort -u | sed 's#^#./#')
          go build -tags jsonschema $pkgs

      - name: Regenerate
        run: go generate ./...

      - name: Verify generated files are current
        run: test -z "$(git status --porcelain)"

      - name: Verify no-change generation mode
        run: JSONSCHEMA_NO_CHANGES=1 go generate ./...

      - name: Test regenerated checkout
        run: go test ./...

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SEMANTIC_RELEASE_ENABLED == 'true'
    needs: test-and-generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish semantic release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          semantic_version: 25.0.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
